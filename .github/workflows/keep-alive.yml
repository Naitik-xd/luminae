name: Supabase Keep Alive

on:
  schedule:
    - cron: '0 9 * * 1,4'
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    name: Ping Supabase Database
    steps:
      - name: Send GET request to bookings table
        run: |
          curl -s -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/bookings?select=*&limit=1" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
